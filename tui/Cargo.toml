[package]
name = "claive-tui"
version = "0.1.0"
edition = "2024"
description = "Read-only triage dashboard for Claive multi-harness coding workers"
license = "MIT"

[[bin]]
name = "claive-tui"
path = "src/main.rs"

[dependencies]
base64 = "0.22.1"
libc = "0.2.186"
notify = { version = "8.2.0", default-features = false }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
unicode-width = "0.2.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = "symbols"
